services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brilian_postgres
    restart: unless-stopped
    # Port TIDAK di-expose ke host — hanya internal antar service di compose ini
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brilian_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-brilian_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brilian_internal

  redis:
    image: redis:7-alpine
    container_name: brilian_redis
    restart: unless-stopped
    # Port TIDAK di-expose ke host — hanya internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brilian_internal

  ollama:
    image: ollama/ollama:latest
    container_name: brilian_ollama
    restart: unless-stopped
    # Port TIDAK di-expose ke host — hanya internal
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brilian_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brilian_app
    restart: unless-stopped
    ports:
      # Port 9000 di host → 3000 di container (hindari konflik dengan app lain)
      - "9000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-brilian_ai}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OLLAMA_ENDPOINT: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-qwen2.5vl:3b}
      CURATION_MODEL_NAME: ${CURATION_MODEL_NAME:-llama3.2:3b}
      CHAT_MODEL_NAME: ${CHAT_MODEL_NAME:-gemma2:2b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-bge-m3}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - brilian_internal

networks:
  brilian_internal:
    name: brilian_internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
