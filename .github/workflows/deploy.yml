name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            DEPLOY_DIR="/root/Brilian.Ai"

            echo "📥 Pulling latest code..."
            cd $DEPLOY_DIR

            # Jika repo belum ada, clone dulu
            if [ ! -d ".git" ]; then
              git clone https://github.com/Muhamad-SazidanA/BrilianAi.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            echo "📝 Menyalin .env jika belum ada..."
            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo "⚠️  .env dibuat dari .env.example — pastikan isi sudah benar!"
            fi

            echo "🐳 Membangun & menjalankan container..."
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build

            echo "✅ Deploy selesai! App berjalan di port 9000"
